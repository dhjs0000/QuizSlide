<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>双人对战模式 - 单词答题游戏</title>
    <link rel="stylesheet" href="Snapshot_styles.css">
    <style>
        /* 双人对战模式专用样式 */
        .pvp-container {
            display: flex;
            gap: 20px;
            margin: 20px 0;
            min-height: 400px;
        }
        
        .player-area {
            flex: 1;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            border: 2px solid #e0e0e0;
            transition: all 0.3s ease;
        }
        
        .player-area.active {
            border-color: #3498db;
            box-shadow: 0 6px 20px rgba(52, 152, 219, 0.3);
        }
        
        .player-header {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #ecf0f1;
        }
        
        .player-name {
            font-size: 24px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 10px;
        }
        
        .player-score {
            font-size: 32px;
            font-weight: bold;
            color: #27ae60;
            margin-bottom: 5px;
        }
        
        .player-stats {
            display: flex;
            justify-content: space-around;
            font-size: 14px;
            color: #7f8c8d;
        }
        
        .question-display {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            margin: 15px 0;
            text-align: center;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 500;
            color: #2c3e50;
            border: 1px solid #e9ecef;
        }
        
        .pvp-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 15px 0;
        }
        
        .pvp-option-btn {
            padding: 12px 8px;
            border: 2px solid #bdc3c7;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 14px;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        
        .pvp-option-btn:hover:not(:disabled) {
            border-color: #3498db;
            background: #f8f9fa;
        }
        
        .pvp-option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }
        
        .pvp-option-btn.correct {
            background: #d4edda;
            border-color: #28a745;
            color: #155724;
        }
        
        .pvp-option-btn.incorrect {
            background: #f8d7da;
            border-color: #dc3545;
            color: #721c24;
        }
        
        .pvp-result {
            text-align: center;
            padding: 10px;
            border-radius: 8px;
            margin: 10px 0;
            font-weight: bold;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .pvp-result.correct {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .pvp-result.incorrect {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .pvp-controls {
            text-align: center;
            margin: 20px 0;
        }
        
        .pvp-setup {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 30px;
            margin: 20px 0;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        
        .pvp-setup h3 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 25px;
        }
        
        .setup-section {
            margin: 20px 0;
        }
        
        .setup-section label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #34495e;
        }
        
        .player-input {
            width: 100%;
            padding: 10px;
            border: 2px solid #bdc3c7;
            border-radius: 6px;
            font-size: 16px;
            margin-bottom: 10px;
        }
        
        .question-count-options {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .count-btn {
            padding: 10px 20px;
            border: 2px solid #bdc3c7;
            border-radius: 6px;
            background: white;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 14px;
        }
        
        .count-btn:hover {
            border-color: #3498db;
            background: #f8f9fa;
        }
        
        .count-btn.active {
            background: #3498db;
            color: white;
            border-color: #3498db;
        }
        
        .pvp-results {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 30px;
            margin: 20px 0;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        
        .winner-announcement {
            font-size: 36px;
            font-weight: bold;
            color: #27ae60;
            margin: 20px 0;
            padding: 20px;
            background: linear-gradient(135deg, #d4edda, #c3e6cb);
            border-radius: 15px;
            border: 2px solid #28a745;
        }
        
        .draw-announcement {
            font-size: 32px;
            font-weight: bold;
            color: #f39c12;
            margin: 20px 0;
            padding: 20px;
            background: linear-gradient(135deg, #fff3cd, #ffeaa7);
            border-radius: 15px;
            border: 2px solid #f39c12;
        }
        
        .final-stats {
            display: flex;
            justify-content: space-around;
            margin: 30px 0;
            gap: 20px;
        }
        
        .final-stats .player-final {
            flex: 1;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            border: 2px solid #e9ecef;
        }
        
        .final-stats .player-final.winner {
            border-color: #28a745;
            background: linear-gradient(135deg, #d4edda, #c3e6cb);
        }
        
        .timer-display {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            color: #e74c3c;
            margin: 15px 0;
            padding: 10px;
            background: #fff5f5;
            border-radius: 8px;
            border: 2px solid #e74c3c;
        }
        
        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e9ecef;
            border-radius: 4px;
            overflow: hidden;
            margin: 10px 0;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #3498db, #2980b9);
            transition: width 0.3s ease;
        }
        
        .back-to-main {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1000;
        }
        
        .back-btn {
            padding: 10px 15px;
            background: #95a5a6;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s ease;
        }
        
        .back-btn:hover {
            background: #7f8c8d;
        }
        
        @media (max-width: 768px) {
            .pvp-container {
                flex-direction: column;
                gap: 15px;
            }
            
            .pvp-options {
                grid-template-columns: 1fr;
            }
            
            .final-stats {
                flex-direction: column;
            }
            
            .question-count-options {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>
<body>
    <div class="back-to-main">
        <button class="back-btn" onclick="window.location.href='Snapshot_html.html'">← 返回主界面</button>
    </div>

    <div class="container" style="width: 100%;">
        <header>
            <h1>双人对战模式</h1>
            <div class="app-mode-selector">
                <button id="lecture-mode" class="app-mode-btn">返回首页</button>
            </div>
        </header>

        <main>
            <!-- 对战设置界面 -->
            <div id="pvp-setup" class="pvp-setup">
                <h3>🎮 双人对战设置</h3>
                
                <div class="setup-section">
                    <label>玩家1名称：</label>
                    <input type="text" id="player1-name" class="player-input" placeholder="输入玩家1名称" value="玩家1">
                </div>
                
                <div class="setup-section">
                    <label>玩家2名称：</label>
                    <input type="text" id="player2-name" class="player-input" placeholder="输入玩家2名称" value="玩家2">
                </div>
                
                <div class="setup-section">
                    <label>题目数量：</label>
                    <div class="question-count-options">
                        <button class="count-btn" data-count="5">5题</button>
                        <button class="count-btn active" data-count="10">10题</button>
                        <button class="count-btn" data-count="20">20题</button>
                        <button class="count-btn" data-count="custom">自定义</button>
                    </div>
                    <input type="number" id="custom-count" class="player-input" placeholder="输入自定义题数" min="5" max="50" style="display: none;">
                </div>
                
                <div class="setup-section">
                    <label>答题模式：</label>
                    <div class="question-count-options">
                        <button class="mode-btn active" data-mode="chinese-to-english">中文→英文</button>
                        <button class="mode-btn" data-mode="english-to-chinese">英文→中文</button>
                        <button class="mode-btn" data-mode="random">随机模式</button>
                    </div>
                </div>
                
                <div class="setup-section">
                    <label>自动切换时间：</label>
                    <div class="question-count-options">
                        <button class="auto-switch-btn active" data-time="0">手动切换</button>
                        <button class="auto-switch-btn" data-time="1">1秒</button>
                        <button class="auto-switch-btn" data-time="2">2秒</button>
                        <button class="auto-switch-btn" data-time="3">3秒</button>
                        <button class="auto-switch-btn" data-time="5">5秒</button>
                    </div>
                </div>
                
                <div class="pvp-controls">
                    <button id="start-pvp" class="control-btn" style="background: #e74c3c; color: white; font-size: 18px; padding: 15px 30px;">
                        🚀 开始对战
                    </button>
                </div>
            </div>

            <!-- 对战界面 -->
            <div id="pvp-game" class="pvp-game" style="display: none;">
                <div class="timer-display">
                    ⏱️ 对战时间：<span id="pvp-timer">00:00</span>
                </div>
                
                <div class="progress-bar">
                    <div id="progress-fill" class="progress-fill" style="width: 0%"></div>
                </div>
                
                <div class="pvp-container">
                    <!-- 玩家1区域 -->
                    <div id="player1-area" class="player-area">
                        <div class="player-header">
                            <div id="player1-name-display" class="player-name">玩家1</div>
                            <div id="player1-score" class="player-score">0</div>
                            <div class="player-stats">
                                <span>正确：<span id="player1-correct">0</span></span>
                                <span>错误：<span id="player1-wrong">0</span></span>
                                <span>进度：<span id="player1-progress">0/10</span></span>
                            </div>
                        </div>
                        
                        <div id="player1-question" class="question-display">等待开始...</div>
                        
                        <div id="player1-options" class="pvp-options">
                            <button class="pvp-option-btn" data-option="0"></button>
                            <button class="pvp-option-btn" data-option="1"></button>
                            <button class="pvp-option-btn" data-option="2"></button>
                            <button class="pvp-option-btn" data-option="3"></button>
                        </div>
                        
                        <div id="player1-result" class="pvp-result"></div>
                    </div>
                    
                    <!-- 玩家2区域 -->
                    <div id="player2-area" class="player-area">
                        <div class="player-header">
                            <div id="player2-name-display" class="player-name">玩家2</div>
                            <div id="player2-score" class="player-score">0</div>
                            <div class="player-stats">
                                <span>正确：<span id="player2-correct">0</span></span>
                                <span>错误：<span id="player2-wrong">0</span></span>
                                <span>进度：<span id="player2-progress">0/10</span></span>
                            </div>
                        </div>
                        
                        <div id="player2-question" class="question-display">等待开始...</div>
                        
                        <div id="player2-options" class="pvp-options">
                            <button class="pvp-option-btn" data-option="0"></button>
                            <button class="pvp-option-btn" data-option="1"></button>
                            <button class="pvp-option-btn" data-option="2"></button>
                            <button class="pvp-option-btn" data-option="3"></button>
                        </div>
                        
                        <div id="player2-result" class="pvp-result"></div>
                    </div>
                </div>
                
                <div class="pvp-controls">
                    <button id="next-pvp-round" class="control-btn" style="display: none;">下一轮</button>
                    <button id="end-pvp" class="control-btn" style="background: #e74c3c; color: white;">结束对战</button>
                </div>
            </div>

            <!-- 对战结果界面 -->
            <div id="pvp-results" class="pvp-results" style="display: none;">
                <h2>🏆 对战结果</h2>
                <div id="winner-announcement" class="winner-announcement"></div>
                
                <div class="final-stats">
                    <div id="player1-final" class="player-final">
                        <h3 id="player1-final-name">玩家1</h3>
                        <div style="font-size: 24px; font-weight: bold; color: #27ae60; margin: 10px 0;">
                            <span id="player1-final-score">0</span>分
                        </div>
                        <div style="color: #7f8c8d;">
                            <div>正确：<span id="player1-final-correct">0</span>题</div>
                            <div>错误：<span id="player1-final-wrong">0</div>
                            <div>正确率：<span id="player1-final-accuracy">0%</span></div>
                        </div>
                    </div>
                    
                    <div id="player2-final" class="player-final">
                        <h3 id="player2-final-name">玩家2</h3>
                        <div style="font-size: 24px; font-weight: bold; color: #27ae60; margin: 10px 0;">
                            <span id="player2-final-score">0</span>分
                        </div>
                        <div style="color: #7f8c8d;">
                            <div>正确：<span id="player2-final-correct">0</span>题</div>
                            <div>错误：<span id="player2-final-wrong">0</div>
                            <div>正确率：<span id="player2-final-accuracy">0%</span></div>
                        </div>
                    </div>
                </div>
                
                <div class="pvp-controls">
                    <button id="restart-pvp" class="control-btn" style="background: #27ae60; color: white;">再来一局</button>
                    <button id="back-to-main-from-pvp" class="control-btn">返回主界面</button>
                </div>
            </div>
        </main>

        <!-- 题库管理 -->
        <footer>
            <div class="bank-management">
                <h3>题库管理</h3>
                <div class="available-banks">
                    <label>可用题库:</label>
                    <div id="bank-list" class="bank-list">
                        <!-- 动态加载的题库列表 -->
                    </div>
                </div>
                <div class="selected-banks">
                    <label>已选择题库:</label>
                    <div id="selected-bank-list" class="selected-bank-list">
                        <!-- 已选择的题库 -->
                    </div>
                </div>
                <button id="load-selected-banks" class="control-btn">加载选中题库</button>
            </div>
        </footer>
    </div>

    <!-- 中文拼音转换库 -->
    <script src="pinyin-pro.js"></script>
    <!-- 英文音标数据 -->
    <script src="json/en_US.json" type="application/json"></script>
    <script src="json/en_UK.json" type="application/json"></script>
    <!-- 双人对战逻辑 -->
    <script src="Snapshot_pvp.js"></script>
</body>
</html>

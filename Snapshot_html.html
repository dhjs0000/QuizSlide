<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>单词答题游戏</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>单词答题游戏</h1>
            <div class="app-mode-selector">
                <button id="lecture-mode" class="app-mode-btn active">讲台模式</button>
                <button id="quiz-mode" class="app-mode-btn">答题模式</button>
                <button id="challenge-mode" class="app-mode-btn">挑战模式</button>
            </div>
            <div class="preview-switch">
                <button id="preview-mode" class="preview-btn">切换到预览版</button>
            </div>
            <div class="mode-selector" id="regular-mode-selector">
                <button id="chinese-to-english" class="mode-btn active">中文→英文</button>
                <button id="english-to-chinese" class="mode-btn">英文→中文</button>
                <button id="random-mode" class="mode-btn">随机模式</button>
            </div>
            <div class="speech-settings">
                <button id="speech-settings-btn" class="speech-settings-btn" title="语音设置">
                    ⚙️ 语音设置
                </button>
                <div id="speech-panel" class="speech-panel hidden">
                    <h4>语音设置</h4>
                    <div class="setting-item">
                        <label for="speech-rate">语速:</label>
                        <input type="range" id="speech-rate" min="0.5" max="2" step="0.1" value="0.8">
                        <span id="speech-rate-value">0.8</span>
                    </div>
                    <div class="setting-item">
                        <label for="speech-pitch">音调:</label>
                        <input type="range" id="speech-pitch" min="0.5" max="2" step="0.1" value="1.0">
                        <span id="speech-pitch-value">1.0</span>
                    </div>
                    <div class="setting-item">
                        <label for="speech-volume">音量:</label>
                        <input type="range" id="speech-volume" min="0" max="1" step="0.1" value="1.0">
                        <span id="speech-volume-value">1.0</span>
                    </div>
                    <div class="setting-item">
                        <label for="auto-speak">自动发音:</label>
                        <input type="checkbox" id="auto-speak">
                    </div>
                    <button id="close-speech-panel" class="close-panel-btn">关闭</button>
                </div>
            </div>
        </header>
        
        <main>
            <div class="question-area">
                <div id="question" class="question-text">在下方选择题库后开始答题</div>
                <div id="question-phonetic" class="phonetic-text"></div>
                <div id="answer" class="answer-text hidden"></div>
                <div id="answer-phonetic" class="phonetic-text"></div>
                <button id="speak-btn" class="speak-btn" title="点击发音" style="display: none;">
                    🔊 发音
                </button>
            </div>
            
            <!-- 讲台模式控制 -->
            <div class="lecture-controls">
                <button id="show-answer" class="control-btn">显示答案</button>
                <button id="next-question" class="control-btn">下一题</button>
            </div>
            
            <!-- 答题模式控制 -->
            <div class="quiz-controls" style="display: none;">
                <div class="options-container">
                    <button class="option-btn" id="option-a"></button>
                    <button class="option-btn" id="option-b"></button>
                    <button class="option-btn" id="option-c"></button>
                    <button class="option-btn" id="option-d"></button>
                </div>
                <div class="quiz-result" id="quiz-result"></div>
                <button id="next-quiz-question" class="control-btn">下一题</button>
            </div>
            
            <!-- 挑战模式控制 -->
            <div class="challenge-controls" style="display: none;">
                <div class="challenge-mode-selection">
                    <h3>选择挑战模式</h3>
                    <div class="challenge-mode-options">
                        <button class="challenge-mode-btn" data-mode="chinese-to-english">中文→英文</button>
                        <button class="challenge-mode-btn" data-mode="english-to-chinese">英文→中文</button>
                        <button class="challenge-mode-btn" data-mode="random">随机模式</button>
                    </div>
                </div>
                <div class="challenge-quiz-interface" style="display: none;">
                    <div class="challenge-settings">
                        <label>自动切换时间:</label>
                        <select id="auto-switch-time">
                            <option value="0.1">0.1秒</option>
                            <option value="0.3" selected>0.3秒</option>
                            <option value="0.5">0.5秒</option>
                            <option value="1.0">1.0秒</option>
                            <option value="0">从不</option>
                        </select>
                    </div>
                    <div class="challenge-timer">
                        <span>用时: <span id="challenge-time">00:00</span></span>
                    </div>
                    <div class="challenge-score">
                        <span>得分: <span id="challenge-score">0</span></span>
                    </div>
                    <div class="options-container">
                        <button class="option-btn" id="challenge-option-a"></button>
                        <button class="option-btn" id="challenge-option-b"></button>
                        <button class="option-btn" id="challenge-option-c"></button>
                        <button class="option-btn" id="challenge-option-d"></button>
                    </div>
                    <div class="quiz-result" id="challenge-result"></div>
                    <button id="next-challenge-question" class="control-btn">下一题</button>
                </div>
            </div>
            
            <!-- 挑战模式结果 -->
            <div class="challenge-results" style="display: none;">
                <h2>挑战完成！</h2>
                <div class="results-summary">
                    <div class="result-item">
                        <span>总用时:</span>
                        <span id="total-time">00:00</span>
                    </div>
                    <div class="result-item">
                        <span>总得分:</span>
                        <span id="final-score">0</span>
                    </div>
                    <div class="result-item">
                        <span>正确率:</span>
                        <span id="accuracy">0%</span>
                    </div>
                    <div class="result-item">
                        <span>能力分:</span>
                        <span id="ability-score">0</span>
                    </div>
                </div>
                <div class="results-details">
                    <h3>答题详情</h3>
                    <div id="wrong-questions" class="wrong-questions">
                        <h4>错题 (置顶显示)</h4>
                        <div id="wrong-list"></div>
                    </div>
                    <div id="correct-questions" class="correct-questions">
                        <h4>正确题目</h4>
                        <div id="correct-list"></div>
                    </div>
                </div>
                <button id="restart-challenge" class="control-btn">重新开始挑战</button>
            </div>
            
            <div class="stats">
                <span>已答题: <span id="answered-count">0</span></span>
                <span>剩余: <span id="remaining-count">0</span></span>
            </div>
        </main>
        
        <footer>
            <div class="bank-management">
                <h3>题库管理</h3>
                <div class="available-banks">
                    <label>可用题库:</label>
                    <div id="bank-list" class="bank-list">
                        <!-- 动态加载的题库列表 -->
                    </div>
                </div>
                <div class="selected-banks">
                    <label>已选择题库:</label>
                    <div id="selected-bank-list" class="selected-bank-list">
                        <!-- 已选择的题库 -->
                    </div>
                </div>
                <button id="load-selected-banks" class="control-btn">加载选中题库</button>
            </div>
            <div class="file-upload">
                <label for="csv-file">或上传自定义题库文件:</label>
                <input type="file" id="csv-file" accept=".csv">
            </div>
        </footer>
        
        <!-- 背景设置 -->
        <div class="background-settings">
            <h4>背景设置</h4>
            <div class="background-options">
                <label>选择背景:</label>
                <select id="background-selector">
                    <option value="none">无背景</option>
                    <option value="images/BA.jpg">Game "Blue Archive" Wallpaper - Dark</option>
                    <option value="images/BA_Light.jpg">Game "Blue Archive" Wallpaper - Light</option>
                    <option value="images/HZXH.jpg">Hangzhou West Lake</option>
                    <option value="images/Great Wall.png">The Great Wall of China</option>
                </select>
            </div>
            <div class="transparency-options">
                <label for="container-transparency">界面透明度:</label>
                <input type="range" id="container-transparency" min="0.3" max="1.0" step="0.1" value="1.0">
                <span id="transparency-value">100%</span>
            </div>
        </div>
        
        <!-- 版本信息和反馈 -->
        <div class="version-info">
            <div class="version-text">
                <a href="version.html">版本: 1.2.0-Snapshot2</a> |
                问题反馈: <a href="https://github.com/dhjs0000/QuizSlide/issues" target="_blank">GitHub Issues</a> 或
                <a href="mailto:studio@ethernos.cn">studio@ethernos.cn</a>
            </div>
        </div>
    </div>
        <!-- 中文拼音转换库 -->
    <script src="pinyin-pro.js"></script>
    <!-- 英文音标数据 -->
    <script src="json/en_US.json" type="application/json"></script>
    <script src="json/en_UK.json" type="application/json"></script>
    <script src="Snapshot_script.js"></script>
    <script src="main.js"></script>
</body>
</html>
